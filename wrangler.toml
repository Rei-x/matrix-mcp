name = "mcp-server-matrix"
main = "src/worker.ts"
compatibility_date = "2026-02-24"
compatibility_flags = ["nodejs_compat"]

[vars]
MATRIX_BASE_URL = "https://matrix.suzuya.dev"
# MATRIX_ACCESS_TOKEN and MCP_AUTH_TOKEN are stored as secrets via `wrangler secret put`

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
